# DRAFT: include inside the existing HTTPS server {} for tribe-i.ru.
# Keep the existing TLS and all other site routes unchanged.
# 21003 is provisional: confirm it is free and assigned before applying.
location = /sadovskiy-mobile {
    return 308 /sadovskiy-mobile/;
}

location = /sadovskiy-mobile/ {
    include /etc/nginx/snippets/sadovskiy-mobile-proxy.conf;
    limit_except GET { deny all; }
    limit_req zone=sadovskiy_mobile_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:21003/health;
}

location = /sadovskiy-mobile/login {
    include /etc/nginx/snippets/sadovskiy-mobile-proxy.conf;
    limit_except POST { deny all; }
    limit_req zone=sadovskiy_mobile_login burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:21003/login;
}

location ^~ /sadovskiy-mobile/ {
    include /etc/nginx/snippets/sadovskiy-mobile-proxy.conf;
    limit_except GET POST { deny all; }
    limit_req zone=sadovskiy_mobile_api burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:21003/;
}
