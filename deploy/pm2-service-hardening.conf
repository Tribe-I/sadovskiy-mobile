# DRAFT: administrator-only drop-in for the NEW pm2-sadovskiy-mobile unit.
# Never apply to existing PM2 services or a shared PM2 daemon.
# Dedicated user's HOME must be /var/lib/sadovskiy-mobile, mode 0700.
[Service]
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/sadovskiy-mobile
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
MemoryMax=512M
CPUQuota=100%
TasksMax=128
LimitNOFILE=1024
